<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Be Strong Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#F3F4F7;--surface:#fff;--ink:#18233A;--muted:#65708A;--line:#DDE1EA;--acc:#F5B800;--on-acc:#1A1A1A;--in:#14935A;--bad:#D3343B;--warn:#C88A00}
@media (prefers-color-scheme: dark){:root{--bg:#0F1524;--surface:#18203A;--ink:#EEF1F8;--muted:#9AA4BC;--line:#2A3452;--in:#3DD68C;--bad:#FF6B70;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{font-family:"Readex Pro",Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0));line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:10px;padding:2px}
header h1{font-size:1.05rem;margin:0;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.hello{font-size:1.2rem;font-weight:700;margin:6px 0 0}
.muted{color:var(--muted);font-size:.9rem}
.mem{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#2a2a2a,#111);position:relative;overflow:hidden}
.mem:after{content:"";position:absolute;inset:auto -40px -40px auto;width:160px;height:160px;border-radius:50%;background:var(--acc);opacity:.25}
.mem .plan{font-size:1.15rem;font-weight:700}.mem .big{font-size:2.2rem;font-weight:700;color:var(--acc);line-height:1.1}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.b-ok{background:#E3F6EC;color:#14935A}.b-bad{background:#FDE7E8;color:#D3343B}.b-warn{background:#FFF3D6;color:#9A6A00}.b-frz{background:#E2F4FB;color:#1C7FA3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}.kpi b{font-size:1.4rem;display:block}.kpi span{color:var(--muted);font-size:.82rem}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:var(--acc);color:var(--on-acc);cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.small{display:inline-block;width:auto;padding:7px 14px;margin:0;font-size:.85rem}
.btn.wa{background:#1FA855;color:#fff}
input{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
label{display:block;font-size:.88rem;color:var(--muted);margin:10px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0));z-index:10}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer}
nav button i{font-style:normal;font-size:1.3rem}nav button.on{color:var(--ink);font-weight:700}
section[hidden]{display:none}
.qrbox{background:#fff;border-radius:18px;padding:18px;width:fit-content;margin:10px auto}
.code{font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;font-weight:700;text-align:center;letter-spacing:2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.days button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:7px 2px;font:inherit;font-size:.76rem;cursor:pointer;line-height:1.3}
.days button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.cls{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;border-inline-start:6px solid var(--acc)}
.cls .g{flex:1}.cls .n{font-weight:700}
.list{list-style:none;margin:0;padding:0}.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.list li:last-child{border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:14px}
.news{border-inline-start:4px solid var(--acc);padding:8px 12px;background:var(--bg);border-radius:10px;margin:8px 0}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .card{width:100%;max-width:380px;text-align:center}
#lock img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:22px;padding:6px}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin-top:8px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
canvas{max-width:100%}
</style>
</head>

      '<div class="mem" style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="plan">'+esc(me.planLabel||"")+'</span><span class="badge '+S[1]+'">'+S[0]+'</span></div>'+
      (me.sessions!=null ? '<div class="big" style="margin-top:12px">'+ar(Math.max(0,me.sessions))+'</div><div>حصة باقية</div>' : '<div class="big" style="margin-top:12px">'+ar(Math.max(0,dl))+'</div><div>يوم باقي</div>')+
      '<div style="margin-top:8px;opacity:.85">لحد '+fmtDate(me.end)+(me.frozenAt?' · متجمد من '+fmtDate(me.frozenAt):'')+'</div></div>'+
      '<div class="grid2" style="margin-top:12px"><div class="kpi"><b>'+(visitsN?ar(mo):"…")+'</b><span>زيارة الشهر ده</span></div><div class="kpi"><b>'+ar(me.invites||0)+'</b><span>دعوات باقية</span></div>'+
      (me.pt?'<div class="kpi"><b>'+ar(me.pt.left||0)+'</b><span>حصص PT باقية'+(me.pt.trainerName?' · كابتن '+esc(me.pt.trainerName):'')+'</span></div>':'')+
      ((me.due||0)>0?'<div class="kpi"><b style="color:var(--bad)">'+money(me.due)+' ج</b><span>باقي عليك</span></div>':'')+'</div>'+
      (st==="expired"||st==="soon" ? '<div class="card" style="border-color:var(--acc)"><b>'+(st==="expired"?"اشتراكك خلص":"اشتراكك قرّب يخلص")+'</b><div class="muted">جدّد من الريسبشن أو كلّمنا.</div>'+(pub.contact?'<a class="btn wa" target="_blank" href="https://wa.me/'+wa(pub.contact)+'?text='+encodeURIComponent("عايز أجدد اشتراكي · "+me.code)+'">كلّمنا واتساب</a>':'')+'</div>' : '')+
      '<button class="btn" data-go="card">🪪 كارتي للدخول</button>'+
      (news.length?'<div class="card"><b>📰 أخبار الجيم</b>'+news.map(n => '<div class="news"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.text||"")+'</div></div>').join("")+'</div>':'');
  }
  if (sec==="card") {
    $("#s-card").innerHTML = '<div class="card" style="text-align:center"><p class="hello" style="margin:0">'+esc(me.name)+'</p><span class="badge '+S[1]+'">'+S[0]+'</span>'+
      '<div class="qrbox"><div id="qr"></div></div><div class="code">'+esc(me.code)+'</div><p class="muted">وريه للريسبشن عند الدخول</p><p class="muted">'+esc(me.planLabel||"")+' · لحد '+fmtDate(me.end)+'</p></div>';
    const draw = () => { if (typeof QRCode === "undefined") return setTimeout(draw, 300); $("#qr").innerHTML = ""; new QRCode($("#qr"), {text:me.code, width:220, height:220, correctLevel:QRCode.CorrectLevel.M}); };
    draw();
  }
  if (sec==="classes") {
    const dates = weekDates(); if (!dates.includes(cday)) cday = dates[0];
    const cls = (pub.classes||[]).filter(c => (c.days||[]).includes(new Date(cday+"T12:00:00").getDay())).sort((a,b) => (a.time||"").localeCompare(b.time||""));
    $("#s-classes").innerHTML = '<h3 style="margin:6px 0 0">🗓️ الكلاسات</h3><div class="days">'+dates.map(d => '<button data-day="'+d+'" class="'+(d===cday?"on":"")+'">'+DOWS[new Date(d+"T12:00:00").getDay()]+'<br><small>'+ar(+d.slice(8))+'/'+ar(+d.slice(5,7))+'</small></button>').join("")+'</div>'+
      (cls.length ? cls.map(c => { const o = occState(c, cday), full = o.cap && o.count >= o.cap;
        const act = st==="expired" ? '<span class="badge b-bad">جدّد الأول</span>' : o.mine ? (o.mine.att ? '<span class="badge b-ok">حضرت ✓</span>' : '<div style="text-align:center"><span class="badge '+(o.mine.wait?"b-warn":"b-ok")+'">'+(o.mine.wait?"انتظار #"+ar(o.mine.wait):"حاجز ✓")+'</span><br><button class="btn ghost small" style="margin-top:4px" data-cancel="'+esc(c.id)+'">ألغِ</button></div>') : '<button class="btn small" data-book="'+esc(c.id)+'">'+(full?"قايمة انتظار":"احجز")+'</button>';
        return '<div class="cls" style="border-inline-start-color:'+esc(c.color||"var(--acc)")+'"><div class="g"><div class="n">'+esc(c.name)+'</div><div class="muted">'+fmt12(c.time)+' · '+ar(c.dur||60)+' دقيقة'+(c.coach?' · كابتن '+esc(c.coach):'')+'</div><div class="muted">'+(o.cap?ar(o.count)+' من '+ar(o.cap)+' حاجزين':'')+(o.wait?' · '+ar(o.wait)+' انتظار':'')+'</div></div>'+act+'</div>'; }).join("") : '<p class="empty">مفيش كلاسات اليوم ده.</p>');
  }
  if (sec==="progress") {
    const IB = (me.inbody||[]).slice().sort((a,b) => a.date.localeCompare(b.date)), last = IB[IB.length-1], first = IB[0];
    const diff = (k) => last && first && last!==first && last[k]!=="" && first[k]!=="" ? (+last[k] - +first[k]) : null;
    const dv = (k, u, good) => { const d = diff(k); if (d===null) return ""; const ok = good==="down" ? d<0 : d>0; return '<div class="muted" style="color:'+(ok?"var(--in)":"var(--bad)")+'">'+(d>0?"+":"")+ar(Math.round(d*10)/10)+u+' من أول قياس</div>'; };
    $("#s-progress").innerHTML = '<h3 style="margin:6px 0 0">📈 تقدّمي</h3>'+(last ? '<div class="grid2" style="margin-top:10px"><div class="kpi"><b>'+ar(last.weight||"—")+'</b><span>الوزن (كجم)</span>'+dv("weight"," كجم","down")+'</div><div class="kpi"><b>'+ar(last.fat||"—")+'٪</b><span>الدهون</span>'+dv("fat","٪","down")+'</div><div class="kpi"><b>'+ar(last.muscle||"—")+'</b><span>العضل (كجم)</span>'+dv("muscle"," كجم","up")+'</div><div class="kpi"><b>'+fmtDate(last.date)+'</b><span>آخر قياس</span></div></div>'+(IB.length>1?'<div class="card"><canvas id="ibc" height="220"></canvas></div>':'') : '<p class="empty">لسه مفيش قياسات InBody. اطلبها من الكوتش.</p>')+
      '<div class="card"><b>آخر زياراتك</b><ul class="list">'+((visitsN||[]).slice(0,10).map(v => '<li>➡️ <div style="flex:1">'+DOWS[new Date(v.day+"T12:00:00").getDay()]+' '+fmtDate(v.day)+'</div><span class="muted">'+fmtTime(v.at)+'</span></li>').join("") || '<li class="empty">مفيش</li>')+'</ul></div>';
    if (IB.length > 1) loadChart().then(() => { if (sec!=="progress") return; new Chart($("#ibc"), {type:"line", data:{labels:IB.map(x => fmtDate(x.date)), datasets:[{label:"الوزن", data:IB.map(x => +x.weight||null), borderColor:"#262626", tension:.3},{label:"الدهون ٪", data:IB.map(x => +x.fat||null), borderColor:"#D64545", tension:.3},{label:"العضل", data:IB.map(x => +x.muscle||null), borderColor:"#14935A", tension:.3}]}, options:{plugins:{legend:{position:"bottom"}}}}); }).catch(() => {});
  }
  if (sec==="more") {
    const news = (pub.news||[]).slice().sort((a,b) => b.at-a.at);
    $("#s-more").innerHTML = '<div class="card"><b>📰 كل الأخبار والعروض</b>'+(news.length?news.map(n => '<div class="news"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.text||"")+'</div></div>').join(""):'<p class="empty">مفيش أخبار.</p>')+'</div>'+
      (pub.contact?'<a class="btn wa" target="_blank" href="https://wa.me/'+wa(pub.contact)+'">💬 كلّم الجيم واتساب</a>':'')+
      '<div class="card"><b>🔑 غيّر الباسورد</b><label>الباسورد الحالي</label><input id="pOld" type="password" inputmode="numeric"><label>الباسورد الجديد (٦ أرقام أو حروف على الأقل)</label><input id="pNew" type="password"><button class="btn ghost" id="pSave">غيّر</button></div>'+
      '<button class="btn ghost" id="logout">خروج</button>';
    $("#pSave").addEventListener("click", async () => { const o = $("#pOld").value, n = $("#pNew").value; if (n.length < 6) { toast("الباسورد الجديد ٦ حروف على الأقل."); return; }
      try{ await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, o)); await updatePassword(auth.currentUser, n); toast("الباسورد اتغيّر"); $("#pOld").value = $("#pNew").value = ""; }catch(e){ toast("الباسورد الحالي غلط."); } });
    $("#logout").addEventListener("click", () => signOut(auth));
  }
}
const wa = p => { let x = String(p||"").replace(/\D/g,""); if (x.startsWith("0")) x = "2"+x; return x; };
function loadChart(){ if (window.Chart) return Promise.resolve(); return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
document.addEventListener("click", e => {
  const n = e.target.closest("nav [data-s]"); if (n) { sec = n.dataset.s; render(); window.scrollTo({top:0}); return; }
  const g = e.target.closest("[data-go]"); if (g) { sec = g.dataset.go; render(); return; }
  const d = e.target.closest("[data-day]"); if (d) { cday = d.dataset.day; render(); return; }
  const b = e.target.closest("[data-book]"); if (b) { const c = (pub.classes||[]).find(x => x.id===b.dataset.book); if (c) book(c, cday, "book"); return; }
  const c2 = e.target.closest("[data-cancel]"); if (c2) { const c = (pub.classes||[]).find(x => x.id===c2.dataset.cancel); if (c) book(c, cday, "cancel"); return; }
});
$("#refresh").addEventListener("click", () => { loadBooks(); loadVisits(); toast("اتحدّث"); });
</script>
</body>
</html>
